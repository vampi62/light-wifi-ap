# Configuration for dnsmasq
#dhcp-autoritative
domain-needed
bogus-priv

# log every DHCP exchange (DISCOVER, OFFER, REQUEST, ACK) in `docker logs`
log-dhcp

# interface used by the hotspot (same as in hostapd.conf)
interface=wlan_light_wifi
  dhcp-option=3,192.168.5.1
  
  dhcp-range=192.168.5.10,192.168.5.40,255.255.255.0,24h
  listen-address=::1,127.0.0.1,192.168.5.1

# static leases (optional)
#  dhcp-host=aa:bb:cc:dd:ee:ff,192.168.5.50
